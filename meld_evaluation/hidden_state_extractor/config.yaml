# Fixed configuration for hidden-state extraction.
# Experiment-specific choices are passed on the command line:
#   --model, --method, --corpus

seed: 313

runtime:
  # Physical GPU to expose. The script uses only this one GPU.
  gpu_id: 0

paths:
  cache_dir: ./data/cache
  # Output directory for extracted hidden-state tensors.
  output_dir: .

# Method -> pooling mapping.
# All returned hidden states are stored; downstream metric code selects layers as needed.
methods:
  meld:
    pooling: mean_pool
  mexa:
    pooling: mexa_pool
  lr:
    pooling: last_token

tokenizer:
  add_special_tokens: true
  padding: max_length
  max_length: 128
  truncation: true
  return_tensors: pt

corpora:
  flores:
    main_dir: ./data/flores/
    subset_file: flores_plus_devtest_subset.feather
